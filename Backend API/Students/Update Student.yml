info:
  name: Update Student
  type: http
  seq: 4

http:
  method: PUT
  url: http://localhost:8080/api/students/1
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
          "firstName": "Alice",
          "lastName": "Dupont",
          "email": "alice.dupont@example.com"
      }
  auth:
    type: bearer
    token: "{{jwt_token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
