info:
  name: Register
  type: http
  seq: 1

http:
  method: POST
  url: http://localhost:8080/api/register
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
          "firstName": "John",
          "lastName": "Doe",
          "login": "john.doe",
          "password": "password123"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
